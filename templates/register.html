{% extends "base.html" %}

{% block title %}在线白板 - 注册{% endblock %}

{% block content %}
<div class="container auth-container">
    <div class="auth-card">
        <h2>注册</h2>
        <form onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="email" required placeholder="请输入邮箱">
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" required placeholder="3-20个字符" minlength="3" maxlength="20">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" required placeholder="至少6位" minlength="6">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="confirm_password" required placeholder="再次输入密码">
            </div>
            <button type="submit" class="btn btn-primary btn-block">注册</button>
        </form>
        <p class="auth-link">已有账号？<a href="/login">立即登录</a></p>
    </div>
</div>

<script>
async function handleRegister(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const confirm_password = document.getElementById('confirm_password').value;
    try {
        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, username, password, confirm_password })
        });
        const data = await res.json();
        if (data.code === 'SUCCESS') {
            window.location.href = '/';
        } else {
            showToast(data.message);
        }
    } catch (e) {
        showToast('注册失败');
    }
}
</script>
{% endblock %}
